<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in · GWC Social Media Reporting</title>
  <meta name="description" content="Secure sign in for the GWC Social Media Reporting Portal.">
  <link rel="preconnect" href="https://cdn.jsdelivr.net">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="https://use.typekit.net/wtc0foh.css">
  <link rel="stylesheet" href="assets/css/login.css">
</head>
<body class="viewer-login-body">
  <main class="viewer-login-shell">
    <section class="viewer-login-card" aria-labelledby="loginTitle">
      <div class="viewer-login-brand">
        <img src="assets/images/gwc-logo-placeholder.svg" alt="GWC" class="viewer-login-logo">
        <div>
          <div class="viewer-login-eyebrow">Secure reporting portal</div>
          <h1 id="loginTitle">Social Media Reporting</h1>
          <p>Sign in to view the dashboard.</p>
        </div>
      </div>

      <div id="loginAlert" class="alert d-none" role="alert" aria-live="polite"></div>

      <form id="viewerLoginForm" class="viewer-login-form" autocomplete="on">
        <div class="form-group">
          <label for="viewerEmail">Email</label>
          <input id="viewerEmail" name="email" type="email" class="form-control" autocomplete="username" required placeholder="name@company.com">
        </div>

        <div class="form-group">
          <label for="viewerPassword">Password</label>
          <div class="password-field">
            <input id="viewerPassword" name="password" type="password" class="form-control" autocomplete="current-password" required placeholder="Enter password">
            <button id="togglePassword" class="password-toggle" type="button" aria-label="Show password" title="Show password"><i class="bi bi-eye"></i></button>
          </div>
        </div>

        <button id="viewerLoginBtn" class="btn viewer-login-btn" type="submit">
          <span>Sign in</span><i class="bi bi-arrow-right"></i>
        </button>
      </form>

      <div class="viewer-login-note"><i class="bi bi-lock"></i><span>Authorised reporting access only.</span></div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="assets/js/config.js"></script>
  <script src="assets/js/supabase-client.js"></script>
  <script src="assets/js/viewer-login.js"></script>
</body>
</html>
