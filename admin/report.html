<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Edit Social Media Report</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="https://use.typekit.net/wtc0foh.css">
  <link rel="stylesheet" href="../assets/css/admin.css">
</head>
<body class="admin-body">
  <div class="admin-app" id="appLayout">
    <aside class="admin-sidebar" id="appSidebar" aria-label="CMS navigation">
      <div class="admin-sidebar-brand">
        <div class="admin-brand-mark"><img src="../assets/images/gwc-logo-placeholder.svg" alt="GWC"></div>
        <div class="admin-brand-copy"><strong>GWC</strong><span>Reporting CMS</span></div>
      </div>
      <nav class="admin-nav">
        <a class="admin-nav-link" href="index.html"><i class="bi bi-grid-1x2"></i><span>Dashboard</span></a>
        <a class="admin-nav-link active" href="index.html#reports"><i class="bi bi-file-earmark-bar-graph"></i><span>Reports</span></a>
        <a class="admin-nav-link" href="index.html#new-report"><i class="bi bi-plus-square"></i><span>New report</span></a>
      </nav>
      <div class="admin-sidebar-label">Public</div>
      <nav class="admin-nav admin-nav-secondary"><a class="admin-nav-link" href="../index.html" target="_blank" rel="noopener"><i class="bi bi-box-arrow-up-right"></i><span>View dashboard</span></a></nav>
      <button class="admin-collapse" id="sidebarToggle" type="button" aria-label="Collapse sidebar"><i class="bi bi-chevron-double-left"></i><span>Hide</span></button>
    </aside>
    <div class="admin-scrim" id="sidebarScrim"></div>

    <main class="admin-main editor-page">
      <header class="admin-header editor-header">
        <div class="admin-heading-wrap">
          <button class="admin-mobile-menu" id="mobileMenuBtn" type="button" aria-label="Open navigation"><i class="bi bi-list"></i></button>
          <a href="index.html" class="back-link" aria-label="Back to reports"><i class="bi bi-arrow-left"></i></a>
          <div>
            <div class="admin-eyebrow">Monthly report editor</div>
            <div class="editor-title-line"><h1 id="reportTitle">Loading…</h1><span class="status-badge" id="statusBadge">Draft</span></div>
          </div>
        </div>
        <div class="admin-header-actions editor-actions">
          <a class="btn btn-outline-secondary disabled" id="previewBtn" href="#" target="_blank" rel="noopener"><i class="bi bi-eye me-2"></i>Preview</a>
          <button class="btn btn-outline-dark" id="saveBtn" type="button"><i class="bi bi-save me-2"></i>Save draft</button>
          <button class="btn btn-success" id="publishBtn" type="button" disabled><i class="bi bi-check2-circle me-2"></i>Publish</button>
        </div>
      </header>

      <div id="editorAlert" class="alert d-none" role="alert"></div>

      <div class="editor-tabs-wrap">
        <nav class="editor-tabs" id="editorTabs" aria-label="Report editor sections">
          <button class="editor-tab active" data-editor-tab="info" type="button"><i class="bi bi-file-earmark-text"></i>Report info</button>
          <button class="editor-tab" data-editor-tab="linkedin" type="button"><i class="bi bi-linkedin"></i>LinkedIn</button>
          <button class="editor-tab" data-editor-tab="instagram" type="button"><i class="bi bi-instagram"></i>Instagram</button>
          <button class="editor-tab" data-editor-tab="x" type="button"><i class="bi bi-twitter-x"></i>X</button>
        </nav>
      </div>

      <div class="editor-workspace">
        <main class="editor-main">
          <section class="editor-pane active" id="editor-info"></section>
          <section class="editor-pane" id="editor-linkedin"></section>
          <section class="editor-pane" id="editor-instagram"></section>
          <section class="editor-pane" id="editor-x"></section>
        </main>
        <aside class="validation-box">
          <div class="validation-head"><div><div class="admin-section-kicker">Validation</div><h3>Report checks</h3></div><i class="bi bi-shield-check"></i></div>
          <div id="validationSummary">Loading checks…</div>
        </aside>
      </div>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../assets/js/config.js"></script>
  <script src="../assets/js/supabase-client.js"></script>
  <script src="../assets/js/ui-shell.js"></script>
  <script src="../assets/js/admin-report.js"></script>
</body>
</html>
