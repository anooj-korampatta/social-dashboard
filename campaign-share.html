<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <title>Campaign Performance · GWC</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="https://use.typekit.net/wtc0foh.css">
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/campaigns.css">
</head>
<body class="app-body campaign-page-body campaign-share-body">
  <div class="campaign-share-app" id="appLayout">
    <main class="app-main campaign-main campaign-share-main">
      <header class="app-topbar campaign-topbar campaign-share-topbar">
        <div class="topbar-title-wrap">
          <div class="campaign-share-brand"><img src="assets/images/gwc-logo-placeholder.svg" alt="GWC"></div>
          <div><h1 class="page-title">Campaign Performance</h1><div class="page-meta"><span id="campaignMeta">Loading shared campaign…</span> · <span id="campaignShareExpiry">View-only</span></div></div>
        </div>
        <div class="header-actions campaign-header-actions">
          <button id="campaignSnapshotBtn" class="btn btn-outline-secondary campaign-action-btn" type="button" disabled><i class="bi bi-camera me-1"></i>Snapshot</button>
        </div>
      </header>

      <div id="campaignMessage" class="system-message d-none" role="status"></div>

      <section class="campaign-workspace" id="campaignWorkspace">
        <div class="campaign-tabs" role="tablist" aria-label="Campaign analytics sections">
          <button class="campaign-tab active" data-campaign-tab="overview" type="button">Overview</button>
          <button class="campaign-tab" data-campaign-tab="platforms" type="button">Platforms</button>
          <button class="campaign-tab" data-campaign-tab="trend" type="button">Trend</button>
          <button class="campaign-tab" data-campaign-tab="content" type="button">Content</button>
        </div>
        <div class="campaign-stage" id="campaignStage" aria-live="polite"><div class="campaign-loading"><span class="spinner-border spinner-border-sm"></span> Loading shared campaign…</div></div>
      </section>
      <footer class="footer-note campaign-footer">View-only campaign snapshot · GWC Social Media Reporting</footer>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.5.0/dist/chart.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="assets/js/config.js"></script>
  <script src="assets/js/supabase-client.js"></script>
  <script src="assets/js/ui-shell.js"></script>
  <script src="assets/js/campaign-share.js"></script>
  <script src="assets/js/campaign-dashboard.js"></script>
</body>
</html>
