<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GWC Social Media Performance Dashboard</title>
  <meta name="description" content="Interactive GWC social media performance dashboard powered by Supabase.">
  <link rel="preconnect" href="https://cdn.jsdelivr.net">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="https://use.typekit.net/wtc0foh.css">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="app-body">
  <div class="app-layout" id="appLayout">
    <aside class="app-sidebar" id="appSidebar" aria-label="Dashboard navigation">
      <div class="sidebar-brand">
        <div class="brand-mark"><img src="assets/images/gwc-logo-placeholder.svg" alt="GWC"></div>
        <div class="brand-copy">
          <strong>GWC</strong>
          <span>Social Media Reporting</span>
        </div>
      </div>

      <nav class="sidebar-nav" role="tablist" aria-label="Report sections">
        <button class="nav-link sidebar-link active" id="tab-overview" data-bs-toggle="tab" data-bs-target="#pane-overview" type="button" role="tab" aria-controls="pane-overview" aria-selected="true">
          <i class="bi bi-grid-1x2"></i><span>Dashboard</span>
        </button>
        <button class="nav-link sidebar-link" id="tab-linkedin" data-bs-toggle="tab" data-bs-target="#pane-linkedin" type="button" role="tab" aria-controls="pane-linkedin" aria-selected="false">
          <i class="bi bi-linkedin"></i><span>LinkedIn</span>
        </button>
        <button class="nav-link sidebar-link" id="tab-instagram" data-bs-toggle="tab" data-bs-target="#pane-instagram" type="button" role="tab" aria-controls="pane-instagram" aria-selected="false">
          <i class="bi bi-instagram"></i><span>Instagram</span>
        </button>
        <button class="nav-link sidebar-link" id="tab-x" data-bs-toggle="tab" data-bs-target="#pane-x" type="button" role="tab" aria-controls="pane-x" aria-selected="false">
          <i class="bi bi-twitter-x"></i><span>X</span>
        </button>
        <button class="nav-link sidebar-link" id="tab-insights" data-bs-toggle="tab" data-bs-target="#pane-insights" type="button" role="tab" aria-controls="pane-insights" aria-selected="false">
          <i class="bi bi-lightbulb"></i><span>Insights</span>
        </button>
      </nav>

      <div class="sidebar-section-label">Management</div>
      <div class="sidebar-nav sidebar-secondary">
        <a class="sidebar-link" href="admin/login.html"><i class="bi bi-shield-lock"></i><span>Admin CMS</span></a>
      </div>

      <button class="sidebar-collapse" id="sidebarToggle" type="button" aria-label="Collapse sidebar">
        <i class="bi bi-chevron-double-left"></i><span>Hide</span>
      </button>
    </aside>

    <div class="sidebar-scrim" id="sidebarScrim"></div>

    <main class="app-main">
      <header class="app-topbar">
        <div class="topbar-title-wrap">
          <button class="mobile-menu-btn" id="mobileMenuBtn" type="button" aria-label="Open navigation"><i class="bi bi-list"></i></button>
          <div>
            <h1 class="page-title">Dashboard</h1>
            <div class="page-meta"><span id="monthMeta">Loading report…</span> <span id="comparisonMeta"></span> · Organic performance · <span id="sourceMeta">Source</span></div>
          </div>
        </div>
        <div class="header-actions">
          <label class="visually-hidden" for="monthSelect">Month</label>
          <select id="monthSelect" class="form-select month-select" aria-label="Select reporting month" disabled><option>Loading…</option></select>
          <a class="icon-btn" href="admin/login.html" aria-label="Open Admin CMS" title="Admin CMS"><i class="bi bi-person"></i></a>
          <button id="downloadPdfBtn" class="btn btn-download" type="button" disabled><i class="bi bi-download me-2" aria-hidden="true"></i>Download PDF</button>
        </div>
      </header>

      <div id="systemMessage" class="system-message d-none" role="status"></div>

      <section class="app-content tab-content" id="dashboardContent">
        <div class="tab-pane fade show active" id="pane-overview" role="tabpanel" aria-labelledby="tab-overview" tabindex="0"><div id="overviewContent" class="loading-state">Loading dashboard data…</div></div>
        <div class="tab-pane fade" id="pane-linkedin" role="tabpanel" aria-labelledby="tab-linkedin" tabindex="0"><div id="linkedinContent"></div></div>
        <div class="tab-pane fade" id="pane-instagram" role="tabpanel" aria-labelledby="tab-instagram" tabindex="0"><div id="instagramContent"></div></div>
        <div class="tab-pane fade" id="pane-x" role="tabpanel" aria-labelledby="tab-x" tabindex="0"><div id="xContent"></div></div>
        <div class="tab-pane fade" id="pane-insights" role="tabpanel" aria-labelledby="tab-insights" tabindex="0"><div id="insightsContent"></div></div>
      </section>

      <footer class="footer-note">© 2026 GWC Marketing Team | Anooj Korampatta</footer>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.5.0/dist/chart.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/html2pdf.js@0.12.1/dist/html2pdf.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="assets/js/config.js"></script>
  <script src="assets/js/supabase-client.js"></script>
  <script src="assets/js/ui-shell.js"></script>
  <script src="assets/js/dashboard.js"></script>
</body>
</html>
