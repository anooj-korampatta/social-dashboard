<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GWC Social Media Performance Dashboard</title>
  <meta name="description" content="Interactive GWC social media performance dashboard prototype.">

  <link rel="preconnect" href="https://cdn.jsdelivr.net">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="https://use.typekit.net/wtc0foh.css">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <div class="dashboard-shell" id="dashboardRoot">
    <header class="topbar">
      <div class="header-left">
        <img class="brand-logo" src="assets/images/gwc-logo-placeholder.svg" alt="GWC">
        <div class="header-copy">
          <div class="eyebrow">Monthly reporting</div>
          <h1 class="page-title">Social Media Performance</h1>
          <div class="page-meta"><span id="monthMeta">August 2026</span> · Organic performance · Source: Meltwater</div>
        </div>
      </div>

      <div class="header-actions">
        <label class="visually-hidden" for="monthSelect">Month</label>
        <select id="monthSelect" class="form-select" aria-label="Select reporting month"></select>
        <button id="downloadPdfBtn" class="btn btn-download" type="button">
          <i class="bi bi-download me-2" aria-hidden="true"></i>Download PDF
        </button>
      </div>
    </header>

    <nav class="nav-tabs-clean" role="tablist" aria-label="Report sections">
      <button class="nav-link active" id="tab-overview" data-bs-toggle="tab" data-bs-target="#pane-overview" type="button" role="tab" aria-controls="pane-overview" aria-selected="true">Overview</button>
      <button class="nav-link" id="tab-linkedin" data-bs-toggle="tab" data-bs-target="#pane-linkedin" type="button" role="tab" aria-controls="pane-linkedin" aria-selected="false">LinkedIn</button>
      <button class="nav-link" id="tab-instagram" data-bs-toggle="tab" data-bs-target="#pane-instagram" type="button" role="tab" aria-controls="pane-instagram" aria-selected="false">Instagram</button>
      <button class="nav-link" id="tab-x" data-bs-toggle="tab" data-bs-target="#pane-x" type="button" role="tab" aria-controls="pane-x" aria-selected="false">X</button>
      <button class="nav-link" id="tab-insights" data-bs-toggle="tab" data-bs-target="#pane-insights" type="button" role="tab" aria-controls="pane-insights" aria-selected="false">Insights</button>
    </nav>

    <main class="dashboard-main tab-content" id="dashboardContent">
      <section class="tab-pane fade show active" id="pane-overview" role="tabpanel" aria-labelledby="tab-overview" tabindex="0">
        <div id="overviewContent"></div>
      </section>
      <section class="tab-pane fade" id="pane-linkedin" role="tabpanel" aria-labelledby="tab-linkedin" tabindex="0">
        <div id="linkedinContent"></div>
      </section>
      <section class="tab-pane fade" id="pane-instagram" role="tabpanel" aria-labelledby="tab-instagram" tabindex="0">
        <div id="instagramContent"></div>
      </section>
      <section class="tab-pane fade" id="pane-x" role="tabpanel" aria-labelledby="tab-x" tabindex="0">
        <div id="xContent"></div>
      </section>
      <section class="tab-pane fade" id="pane-insights" role="tabpanel" aria-labelledby="tab-insights" tabindex="0">
        <div id="insightsContent"></div>
      </section>
    </main>

    <div class="footer-note">© 2026 GWC Marketing Team</div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.5.0/dist/chart.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/html2pdf.js@0.12.1/dist/html2pdf.bundle.min.js"></script>
  <script src="assets/js/data.js"></script>
  <script src="assets/js/app.js"></script>
</body>
</html>
